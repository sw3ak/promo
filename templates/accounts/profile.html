{% extends "base.html" %}
{% block title %}Профиль - Проверка чека{% endblock %}
{% block content %}
<section class="card card--form">
  <h1 class="title">Профиль</h1>
  <p class="subtitle">Логин: {{ user.get_username }}</p>
  <form class="form form--auth" method="post">
    {% csrf_token %}
    {% include "registration/_form_fields.html" %}
    <button class="btn btn--primary btn--block" type="submit">Сохранить</button>
  </form>
  <div class="profile__actions">
    <a class="btn btn--ghost" href="{% url 'password_change' %}">Сменить пароль</a>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button class="btn btn--ghost" type="submit">Выйти</button>
    </form>
  </div>
</section>
{% endblock %}
