{% for field in form %}
  <div class="field {% if field.errors %}field--invalid{% endif %}">
    <label class="field__label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    <div class="field__control">{{ field }}</div>
    {% if field.help_text %}<div class="field__hint">{{ field.help_text|safe }}</div>{% endif %}
    {% for error in field.errors %}
      <p class="field__error" role="alert"><svg class="icon icon--sm"><use href="#i-warning"></use></svg><span>{{ error }}</span></p>
    {% endfor %}
  </div>
{% endfor %}
